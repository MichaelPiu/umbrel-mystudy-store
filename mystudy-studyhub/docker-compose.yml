version: "3.7"

services:
  app_proxy:
    environment:
      # formato: <id-app>_<nome-servizio>_1
      APP_HOST: mystudy-studyhub_web_1
      APP_PORT: 4470

  web:
    image: studyhub:local
    pull_policy: never
    restart: on-failure
    volumes:
      # progressi, appunti e risorse (riusa la cartella data gia' esistente)
      - "${UMBREL_ROOT}/home/Documents/Study WebApp/data:/app/data"
      # dispense PDF in sola lettura
      - "${UMBREL_ROOT}/home/Documents/Study WebApp/Dispense primo anno:/app/Dispense primo anno:ro"
      - "${UMBREL_ROOT}/home/Documents/Study WebApp/Dispense secondo anno:/app/Dispense secondo anno:ro"
